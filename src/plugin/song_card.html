<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--ink:#fbeedd;--dim:rgba(251,238,221,.42);--acc:#ffab4d;--serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--sans:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0705;color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none}
.bg{position:fixed;inset:0;background:#0d0705}
.bg i{position:absolute;inset:-2%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;animation:push 40s ease-out forwards}
.bg i.on{opacity:1}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.08)}}
.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(13,7,5,.15) 0%,rgba(13,7,5,.25) 45%,rgba(13,7,5,.82) 100%)}
.now{position:fixed;left:4vw;top:max(13vh,60px);display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;border-radius:12px;background:rgba(13,7,5,.5);border:1px solid rgba(255,171,77,.25);animation:rise .6s cubic-bezier(.2,.9,.2,1) both}
.now[hidden]{display:none}
.now img{width:clamp(52px,7vw,84px);aspect-ratio:1;border-radius:8px;object-fit:cover;display:block;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.now img:not([src]),.now img[src=""]{display:none}
.now b{display:block;font:700 clamp(15px,1.8vw,20px)/1.3 var(--serif);letter-spacing:.08em}
.now small{display:block;font:500 clamp(11px,1.2vw,13px)/1.5 var(--sans);color:var(--dim);letter-spacing:.06em}
.now em{display:block;font:600 clamp(10px,1.1vw,12px)/1.4 var(--sans);font-style:normal;letter-spacing:.24em;color:var(--acc)}
.lyr{position:fixed;left:6vw;right:6vw;bottom:12vh;text-align:center}
.lyr p{margin:0;font-family:var(--serif);transition:opacity .5s ease,transform .5s ease}
#prev{font-size:clamp(14px,2vw,20px);color:var(--dim);min-height:1.6em}
#cur{font-weight:700;font-size:clamp(22px,4.2vw,46px);line-height:1.5;letter-spacing:.08em;min-height:1.5em;text-shadow:0 2px 24px rgba(0,0,0,.85),0 0 30px rgba(255,171,77,.25)}
#next{font-size:clamp(13px,1.7vw,18px);color:rgba(251,238,221,.28);min-height:1.6em}
#cur.in{animation:rise .55s cubic-bezier(.2,.9,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.bar{position:fixed;left:0;bottom:0;height:3px;width:0;background:var(--acc);opacity:.7}
#skip{position:fixed;right:max(3vw,12px);bottom:max(3vh,12px);min-height:44px;padding:0 18px;border:1px solid rgba(251,238,221,.4);border-radius:8px;background:rgba(13,7,5,.55);color:var(--ink);font:600 13px/1 var(--sans);cursor:pointer;transition:scale .38s cubic-bezier(.2,.9,.2,1),background-color .22s ease}
@media (hover:hover){#skip:hover{scale:1.018;background:rgba(13,7,5,.8)}}
#skip:active{scale:.965;transition-duration:.1s}
#skip:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body>
<div class="bg" aria-hidden="true"><i id="bgA"></i><i id="bgB"></i></div>
<div class="shade" aria-hidden="true"></div>
<div class="now" id="now" hidden><img id="cov" alt=""><div><em id="who"></em><b id="ttl"></b><small id="ver"></small></div></div>
<div class="lyr" aria-live="polite"><p id="prev"></p><p id="cur"></p><p id="next"></p></div>
<div class="bar" id="bar" aria-hidden="true"></div>
<button id="skip" type="button">略過</button>
<script>
// 唱歌卡：歌由播放器播（卡片層 bgm），這裡照「進卡後經過的秒數」亮歌詞；不吃點擊，唱完才送完成，或玩家按「略過」。
var V = {}, lines = [], bgs = [], imgs = [], dur = 0, off = 0, t0 = 0, done = false, curI = -2, bgI = -1, front = 'bgA';
function num(x, d) { x = parseFloat(x); return isFinite(x) ? x : d; }
function parse(text) {   // 一行「秒數｜內容」
  return String(text || '').split(/\n/).map(function (l) { var m = l.split('｜'); return m.length > 1 ? { t: num(m[0], 0), s: m.slice(1).join('｜').trim() } : null; })
    .filter(Boolean).sort(function (a, b) { return a.t - b.t; });
}
function finish() { if (done) return; done = true; parent.postMessage({ type: 'larch:complete', result: 'complete' }, '*'); }
function showBg(i) {
  var u = imgs[i - 1]; if (!u) return;
  var back = front === 'bgA' ? 'bgB' : 'bgA', b = document.getElementById(back), f = document.getElementById(front);
  b.style.backgroundImage = 'url("' + u + '")'; b.classList.add('on'); f.classList.remove('on'); front = back;
}
function at(list, t) { var k = -1; for (var i = 0; i < list.length; i++) if (list[i].t <= t) k = i; return k; }
function tick() {
  if (done) return;
  var t = (performance.now() - t0) / 1000 - off;
  var b = at(bgs, t); if (b !== bgI) { bgI = b; if (b >= 0) showBg(num(bgs[b].s, 1)); }
  var i = at(lines, t);
  if (i !== curI) {
    curI = i;
    var c = document.getElementById('cur');
    document.getElementById('prev').textContent = i > 0 ? lines[i - 1].s : '';
    c.textContent = i >= 0 ? lines[i].s : '';
    document.getElementById('next').textContent = i + 1 < lines.length ? lines[i + 1].s : '';
    c.classList.remove('in'); void c.offsetWidth; c.classList.add('in');
  }
  document.getElementById('bar').style.width = Math.min(100, t / dur * 100) + '%';
  if (t >= dur + num(V.endHold, 1.5)) { finish(); return; }
  requestAnimationFrame(tick);
}
document.getElementById('skip').addEventListener('click', finish);
addEventListener('message', function (e) {
  var d = e.data; if (!d || d.type !== 'larch:init' || t0) return;
  t0 = performance.now(); V = d.values || {};
  lines = parse(V.lines); bgs = parse(V.backgrounds); dur = num(V.duration, lines.length ? lines[lines.length - 1].t + 5 : 30); off = num(V.offset, .25);
  for (var k = 1; k <= 6; k++) imgs.push(V['image' + k] || '');
  if (!bgs.length && imgs[0]) bgs = [{ t: 0, s: '1' }];
  document.getElementById('who').textContent = V.singer || '';
  document.getElementById('ttl').textContent = V.songTitle || '';
  document.getElementById('ver').textContent = V.songVersion || '';
  if (V.cover) document.getElementById('cov').src = V.cover;
  document.getElementById('now').hidden = !(V.songTitle || V.cover);
  document.getElementById('skip').textContent = V.skipLabel || '略過';
  requestAnimationFrame(tick);
});
parent.postMessage({ type: 'larch:ready' }, '*');
</script>
</body></html>
