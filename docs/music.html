<style>:root{color-scheme:dark;--bg:#140b07;--ink:#fbeedd;--dim:#d6bfa4;--acc:rgb(255,171,77);--acc-rgb:255,171,77;--line:rgba(255,171,77,.28);--pulse:0;--kick:1;--px:0;--py:0;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font:400 16px/1.7 var(--sans);letter-spacing:.03em;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
a{color:var(--dim);text-decoration:none}
button{font:inherit;color:var(--ink);background:none;border:0;cursor:pointer;padding:0}
/* 背景：每首配的劇情 CG，兩層交叉淡化＋慢推鏡；遮罩壓暗到歌詞清楚可讀 */
.stage-bg{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;z-index:0;overflow:hidden;background:var(--bg)}
.stage-bg i{position:absolute;inset:-3%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.8s ease;will-change:opacity,transform;
  transform:translate3d(calc(var(--px)*-14px),calc(var(--py)*-14px),0) scale(1)}
.stage-bg i.on{opacity:1;animation:push 45s ease-out forwards}
@keyframes push{from{transform:translate3d(calc(var(--px)*-14px),calc(var(--py)*-14px),0) scale(1)}to{transform:translate3d(calc(var(--px)*-14px),calc(var(--py)*-14px),0) scale(1.1)}}
.shade{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 85% 75% at 50% 45%,rgba(20,11,7,.2),rgba(20,11,7,.7)),linear-gradient(90deg,rgba(20,11,7,.15) 0%,rgba(20,11,7,.42) 42%,rgba(20,11,7,.52) 100%)}
.glow{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:calc(.12 + var(--pulse)*.5);mix-blend-mode:screen;
  background:radial-gradient(ellipse 55% 60% at 30% 52%,rgba(var(--acc-rgb),.55),transparent 70%)}
/* width/height 不能省：canvas 沒給 CSS 尺寸就用屬性尺寸（W*dpr）排版，dpr 2 的手機上整層特效會放大兩倍、貼在左上角 */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.stage{position:relative;z-index:3;height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:clamp(1rem,4vw,3rem);align-items:center;padding:clamp(1rem,3vw,2.5rem) clamp(1rem,4vw,3rem)}
.side{display:flex;flex-direction:column;align-items:center;gap:.9rem;min-width:0}
.art{position:relative;width:min(100%,min(320px,36vh));aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer;
  box-shadow:0 18px 60px rgba(0,0,0,.6),0 0 calc(18px + var(--pulse)*40px) rgba(var(--acc-rgb),.45);
  transform:perspective(900px) rotateY(calc(var(--px)*6deg)) rotateX(calc(var(--py)*-6deg)) scale(var(--kick));transition:transform .18s cubic-bezier(.22,.61,.36,1)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art-hover{position:absolute;inset:0;display:grid;place-items:center;opacity:0;background:rgba(10,5,3,.42);transition:opacity .25s}
.art:hover .art-hover,.art:focus-visible .art-hover{opacity:1}
.art-hover svg{width:70px;height:70px;fill:rgba(255,255,255,.94);filter:drop-shadow(0 6px 18px rgba(0,0,0,.6))}
.meta{text-align:center;line-height:1.5;max-width:30em}
.meta small{font:600 11px/1 var(--sans);letter-spacing:.24em;color:#ff7a8c}
.meta h1{font:900 clamp(1.4rem,3.4vw,2.1rem)/1.3 var(--serif);margin:.35em 0 .1em;letter-spacing:.1em;text-shadow:0 2px 20px rgba(0,0,0,.7)}
.ver{color:var(--acc);font-size:.95rem}
.one{margin:.4em 0 0;color:#ecd8bf;font-size:.9rem;line-height:1.65;text-shadow:0 1px 10px rgba(0,0,0,.85)}
.note{color:var(--dim);font-size:.82rem}
.ctrl{display:flex;align-items:center;gap:.7rem;width:min(100%,420px);transition:opacity .5s}
.play{width:54px;height:54px;flex:none;border-radius:50%;background:linear-gradient(135deg,#ffc27a,var(--acc));color:#241408;display:grid;place-items:center}
.play:hover{filter:brightness(1.1)}
.play svg{width:22px;height:22px;fill:currentColor}
.ctrl .sm{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:rgba(20,11,7,.45)}
.ctrl .sm svg{width:16px;height:16px;fill:var(--acc)}
.ctrl .sm:hover{border-color:var(--acc)}
.seek{flex:1;min-width:0;display:flex;align-items:center;gap:.5rem}
.seek input{flex:1;min-width:0;height:24px;-webkit-appearance:none;appearance:none;background:none;cursor:pointer}
.seek input::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:rgba(251,238,221,.25)}
.seek input::-moz-range-track{height:3px;border-radius:2px;background:rgba(251,238,221,.25)}
.seek input::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-6px;border-radius:50%;background:var(--acc);border:0;box-shadow:0 0 12px rgba(var(--acc-rgb),.8)}
.seek input::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--acc)}
.seek .t{font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--dim);min-width:2.4em;text-align:center}
/* 曲目表：直式，像專輯背面。一行一首：編號、歌名、版本、長度；正在播的那行換餘燼色、左邊一條線（作者 10-29：原本一排小方塊擠到第 6 首被切掉） */
.tracks{list-style:none;margin:0;padding:0;width:min(100%,420px);border-top:1px solid var(--line);transition:opacity .5s}
.tracks button{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;align-items:baseline;gap:.4em;width:100%;padding:.42em .7em;border-bottom:1px solid rgba(var(--acc-rgb),.14);text-align:left;transition:background .2s,color .2s}
.tracks button span{display:flex;align-items:baseline;gap:.6em;min-width:0;white-space:nowrap;overflow:hidden}
.tracks b{font:500 .95rem/1.3 var(--serif);letter-spacing:.06em}
.tracks small{color:var(--dim);font-size:.74rem;overflow:hidden;text-overflow:ellipsis}
.tracks em,.tracks time{font:500 .72rem/1 var(--sans);color:var(--dim);font-style:normal;font-variant-numeric:tabular-nums}
.tracks button:hover{background:rgba(var(--acc-rgb),.07)}
.tracks .on button{color:var(--acc);background:rgba(var(--acc-rgb),.11);box-shadow:inset 2px 0 0 var(--acc)}
.tracks .on em,.tracks .on small,.tracks .on time{color:var(--acc)}
.credit{margin:0;font-size:.74rem;line-height:1.55;color:var(--dim);text-align:center;max-width:36em;text-shadow:0 1px 8px rgba(0,0,0,.9);transition:opacity .5s}
.todo{background:#b3202f;color:#fff;padding:2px 8px;font-weight:700}
/* 歌詞：目前句放大發光、前後句淡化、整列平滑捲到中間 */
.lyrics{position:relative;height:100%;min-height:0;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent);mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent)}
.lyrics.static{overflow-y:auto;-webkit-user-select:text;user-select:text}
.lyrics ol{list-style:none;margin:0;padding:44vh 0;transition:transform .45s cubic-bezier(.22,.61,.36,1)}
.lyrics.static ol{padding:18vh 0;transform:none!important}
.lyrics li{margin:0 0 .5em;padding:.15em .3em;border-radius:8px;color:rgba(251,238,221,.4);font-size:clamp(1.05rem,2.1vw,1.6rem);line-height:1.6;transition:color .3s,transform .3s,text-shadow .3s;transform-origin:left center;text-shadow:0 1px 10px rgba(0,0,0,.85)}
.lyrics li.link{cursor:pointer}
.lyrics li.link:hover{color:rgba(251,238,221,.7)}
.lyrics li.on{color:var(--acc);transform:scale(1.08);text-shadow:0 0 30px rgba(var(--acc-rgb),.55),0 1px 10px rgba(0,0,0,.9)}
.lyrics li.near{color:rgba(251,238,221,.6)}
.lyrics.static li{color:rgba(251,238,221,.82)}
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:1rem;align-items:center;padding:.7rem 1rem;font-size:.85rem;transition:opacity .5s}
.top a:hover,.top button:hover{color:var(--acc)}
.top button{color:var(--dim);font-size:.85rem}
.top .sp{flex:1}
#show{position:fixed;top:.7rem;right:1rem;z-index:6;padding:6px 12px;border:1px solid var(--line);background:rgba(20,11,7,.6);border-radius:6px;font-size:.85rem;color:var(--dim)}
#show[hidden]{display:none}
body.idle,body.idle *{cursor:none}
body.idle .top,body.idle .ctrl,body.idle .tracks,body.idle .credit{opacity:0;pointer-events:none}
body.hold .top,body.hold .ctrl,body.hold .tracks,body.hold .credit,body.hold .one{opacity:0;pointer-events:none}
#hint{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:7;padding:.45rem 1rem;border-radius:2rem;background:rgba(20,11,7,.8);border:1px solid var(--line);color:var(--dim);font-size:.82rem;opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap}
#hint.show{opacity:1}
/* 直立手機才堆成一欄。橫躺的手機寬度也在 820 以下，但高度只剩三百出頭，堆成一欄會把控制列與歌詞整個擠出畫面。 */
@media (max-width:820px) and (orientation:portrait){
  .stage{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:.7rem;padding:0 16px 12px;align-content:start}
  /* 頻譜環往封面外長出約 0.52 倍封面寬的一圈，是畫在 canvas 上的，版面上不佔位；上緣沒讓出這段空間，光環上半會被切掉。 */
  .art{--w:min(32vw,128px);width:var(--w);margin-top:calc(var(--w)*.52 + 34px)}
  .side{gap:.55rem}
  .meta .one{display:none}
  .meta h1{font-size:1.35rem;margin:.2em 0 0}
  .lyrics ol{padding:30vh 0}
  .credit{display:none}
  /* 手機：兩欄三列，每格「編號＋歌名＋版本」，不放長度，整塊約 120px，留空間給歌詞 */
  .tracks{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:6px;border:0}
  .tracks button{grid-template-columns:1.9em minmax(0,1fr);min-height:38px;padding:.3em .55em;border:1px solid var(--line);border-radius:6px;background:rgba(20,11,7,.5);align-items:center}
  .tracks time{display:none}
  .tracks b{font-size:.86rem}
  .tracks small{font-size:.68rem}
  .ctrl{gap:.5rem}
}
@media (max-width:820px) and (orientation:portrait){#hint{top:3.2rem;bottom:auto;white-space:normal;width:88vw;text-align:center}}
/* 矮的桌機（筆電 1366×768、1280×720）：頁面不捲動，曲目表六行要整個放得下 */
@media (min-width:821px) and (max-height:820px){
  .art{width:min(100%,min(260px,28vh))}
  .side{gap:.55rem}
  .credit{display:none}
  .tracks button{padding:.3em .7em}
}
@media (max-height:560px){
  .stage{padding-top:2.8rem}
  .art{width:min(100%,38vh);margin-top:0}
  .side{gap:.5rem}
  .meta .one,.credit{display:none}
}
@media (max-width:820px) and (orientation:portrait) and (max-height:700px){
  .art{--w:min(24vw,80px);margin-top:calc(var(--w)*.52 + 28px)}
  .meta h1{font-size:1.1rem}
  .meta small{display:none}
  .side{gap:.3rem}
  .play{width:44px;height:44px}
  .ctrl .sm{width:32px;height:32px}
  .tracks button{min-height:32px;padding:.15em .5em}
  .lyrics ol{padding:24vh 0}
}
@media (prefers-reduced-motion:reduce){
  .lyrics ol,.art,.stage-bg i{transition:none}
  .stage-bg i.on{animation:none}
  .glow{display:none}
  .art{transform:none}
}
</style>
</head>

var bubble,anchor;
function addCss(){if(document.getElementById("yz-promo-css"))return;var s=document.createElement("style");s.id="yz-promo-css";s.textContent=CSS;document.head.appendChild(s)}
function inFooter(el){try{return !!(el.closest&&el.closest('footer,nav,[class*="footer"],[id*="footer"]'))}catch(e){return false}}
function findAnchor(){var as=document.querySelectorAll('a[href*="buymeacoffee.com/yazelin"]');if(!as.length)return null;
var vis=[],i,r;for(i=0;i<as.length;i++){r=as[i].getBoundingClientRect();if(r.width||r.height)vis.push(as[i])}
var pool=vis.length?vis:[].slice.call(as);
for(i=0;i<pool.length;i++)if(inFooter(pool[i]))return pool[i];
return pool[pool.length-1]}
function inject(){if(!INJECT||findAnchor()||document.querySelector(".yz-cluster"))return;

function blogLinked(){var as=document.querySelectorAll('a[href^="https://yazelin.github.io"]');for(var i=0;i<as.length;i++){try{if(new URL(as[i].href).pathname==="/")return true}catch(e){}}return false}
function addBlog(){if(!ADDBLOG||document.querySelector(".yz-blog")||blogLinked()||!inFooter(anchor))return;
var c=anchor.cloneNode(true);c.classList.remove("yz-hop","yz-idle");c.classList.add("yz-blog");
c.href="https://yazelin.github.io/";c.setAttribute("aria-label","亞澤的部落格");c.setAttribute("title","亞澤的部落格");

function hop(){anchor.classList.remove("yz-hop");void anchor.offsetWidth;anchor.classList.add("yz-hop")}
var shown=0,MAX_SHOWS=3;
function say(){if(document.hidden)return;var r=anchor.getBoundingClientRect();if(!r.width&&!r.height)return;if(r.bottom<0||r.top>innerHeight)return;shown++;
bubble.textContent=LINES[Math.floor(Math.random()*LINES.length)];

bubble.style.left="0px";bubble.style.top="0px";
var bw=bubble.offsetWidth,bh=bubble.offsetHeight,cx=r.left+r.width/2;
var left=Math.max(8,Math.min(cx-bw/2,innerWidth-bw-8));
var above=r.top-bh-12>=8;
bubble.style.left=left+"px";
bubble.style.top=(above?r.top-bh-12:r.bottom+12)+"px";
bubble.classList.add(above?"yz-above":"yz-below");
bubble.style.setProperty("--yz-tail",Math.max(12,Math.min(cx-left,bw-12))+"px");
hop();
requestAnimationFrame(function(){bubble.classList.add("yz-on")});
setTimeout(function(){bubble.classList.remove("yz-on")},4200)}
function start(){addCss();inject();anchor=findAnchor();if(!anchor)return false;
try{if(getComputedStyle(anchor).display==="inline")anchor.style.display="inline-block"}catch(e){}
anchor.classList.add("yz-idle");
anchor.addEventListener("animationend",function(e){if(e.animationName==="yzHop")anchor.classList.remove("yz-hop")});
try{addBlog()}catch(e){}
bubble=document.createElement("div");bubble.className="yz-bubble";bubble.setAttribute("aria-hidden","true");document.body.appendChild(bubble);
window.__yzPromo=say;
(function loop(first){if(shown>=MAX_SHOWS)return;setTimeout(function(){say();loop(false)},first?18e3+Math.random()*12e3:9e4+Math.random()*9e4)})(true);
return true}
function boot(){var tries=0;(function t(){if(start())return;if(++tries<20)setTimeout(t,1500)})()}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
})();
