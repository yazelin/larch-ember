<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>餘燼介面樣張</title>
<style>
/* 「信紙與餘燼」：對話框是一張泛黃的信紙，邊緣有落日燒出來的餘燼光；選項是摺過的歌譜條；名牌是鉛筆字。 */
:root {
  --paper: rgba(236, 216, 182, .92); --paper-2: rgba(214, 186, 146, .9); --ink: #2b1d14; --ink-soft: #5a4434; --pencil: #6b5a4c;
  --ember: #e8743b; --ember-deep: #a8361f; --rose: #8e1f2a; --ash: #3a3330;
  --serif: "Noto Serif TC", "Songti TC", "Source Han Serif TC", "PMingLiU", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #120c09; }
.stage { position: relative; width: 1600px; height: 900px; overflow: hidden; background: url(../../art/original/cover.png) center/cover; font-family: var(--serif); }
.stage::after { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(18, 10, 6, .55)); content: ""; pointer-events: none; }
/* 對話框：信紙 */
.wrap { position: absolute; left: 64px; right: 64px; bottom: 24px; z-index: 2; }
.box { position: relative; min-height: 200px; padding: 44px 64px 34px;
  background: radial-gradient(120% 140% at 50% 0%, var(--paper), var(--paper-2) 75%, rgba(150, 96, 52, .92));
  color: var(--ink); border-radius: 6px;
  box-shadow: 0 0 0 1px rgba(120, 70, 30, .35), 0 0 26px 2px rgba(232, 116, 59, .35), 0 24px 60px -18px rgba(0, 0, 0, .7);
  }
.box::after { position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 38px 6px rgba(110, 40, 15, .55), inset 0 -2px 0 rgba(232, 116, 59, .6); content: ""; pointer-events: none; }
/* 信紙的橫線與四邊被落日燒過的焦痕 */
.box::before { position: absolute; inset: 0; border-radius: inherit; background:
  repeating-linear-gradient(180deg, transparent 0 33px, rgba(90, 60, 40, .12) 33px 34px),
  radial-gradient(60% 40% at 0% 100%, rgba(168, 54, 31, .28), transparent 70%),
  radial-gradient(50% 35% at 100% 0%, rgba(232, 116, 59, .25), transparent 70%); content: ""; pointer-events: none; }
.name { position: absolute; left: 64px; top: -22px; z-index: 3; padding: 6px 22px 8px; background: var(--ash); color: #f6e7cd; font-size: 18px; letter-spacing: .3em;
  border-radius: 2px; box-shadow: 0 0 0 1px rgba(232, 116, 59, .5), 0 6px 16px -6px rgba(0, 0, 0, .6); }
.name::after { display: inline-block; width: 7px; height: 7px; margin-left: 10px; vertical-align: 2px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 10px var(--ember); content: ""; }
.text { position: relative; margin: 0; font-size: 25px; line-height: 1.9; letter-spacing: .04em; }
.fade { color: rgba(43, 29, 20, .28); }
.next { position: absolute; right: 30px; bottom: 22px; color: var(--ember-deep); font-size: 15px; letter-spacing: .2em; }
/* 選項：摺過的歌譜條 */
.choices { position: absolute; right: 120px; top: 230px; z-index: 2; display: grid; gap: 16px; width: 560px; }
.choice { position: relative; padding: 16px 28px 16px 70px; background: linear-gradient(90deg, var(--paper), var(--paper-2)); border-left: 3px solid var(--rose); color: var(--ink); font-size: 21px; letter-spacing: .06em;
  border-radius: 3px; box-shadow: 0 10px 26px -12px rgba(0, 0, 0, .75), inset 0 0 0 1px rgba(120, 70, 30, .3); }
.choice::before { position: absolute; left: 20px; top: 50%; width: 30px; height: 18px; margin-top: -9px; content: "";
  background: repeating-linear-gradient(180deg, var(--pencil) 0 1px, transparent 1px 4px); opacity: .55; }
.choice::after { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(120, 70, 30, .18); content: ""; }
.choice.on { box-shadow: 0 0 0 2px var(--ember), 0 0 22px 2px rgba(232, 116, 59, .55), 0 10px 26px -12px rgba(0, 0, 0, .75); transform: translateX(-6px); }
.label { position: absolute; left: 24px; top: 20px; z-index: 3; padding: 8px 16px; background: rgba(18, 12, 9, .7); color: #f6e7cd; font: 14px/1.6 system-ui, sans-serif; border-radius: 4px; }
</style>
</head>
<body>
<div class="stage">
  <div class="label">樣張：信紙與餘燼（對話框＋名牌＋選項，選中的是第一個）</div>
  <div class="choices">
    <div class="choice on">他叫程希，坐在三排十四號。</div>
    <div class="choice">我只要唱歌就好。</div>
    <div class="choice">阿爸在等我收攤。</div>
  </div>
  <div class="wrap">
    <div class="name">余靜</div>
  <div class="box">
    <p class="text">太陽在屋頂上面。再過一下<span class="fade">就掉下去了。</span></p>
    <div class="next">▸ 繼續</div>
  </div>
  </div>
</div>
</body>
</html>
