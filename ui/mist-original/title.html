<style>
/* --t 是入場動畫的時間倍率：完整 1、快速 .45、關閉 0（直接停在最後的樣子）。 */

.stage { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; padding: 28px; }
html[data-skin-place="left"] .stage { justify-items: start; padding-left: max(28px, 7vw); }
.card { position: relative; width: min(620px, 100%); max-height: 100%; padding: clamp(32px, 4.4vw, 50px) clamp(26px, 4.6vw, 58px) clamp(28px, 3.6vw, 40px); border: 1px solid rgba(255, 255, 255, .95); border-radius: 30px; background: linear-gradient(165deg, rgba(255, 255, 255, .8), rgba(243, 248, 252, .72) 58%, rgba(236, 244, 250, .76)); color: var(--ink); text-align: center; box-shadow: inset 0 1px 0 #fff, inset 0 0 0 1px rgba(40, 70, 104, .07), 0 44px 90px -26px rgba(30, 54, 84, .42), 0 10px 30px rgba(30, 54, 84, .1); -webkit-backdrop-filter: blur(26px) saturate(1.5); backdrop-filter: blur(26px) saturate(1.5); animation: card-in calc(1.4s * var(--t)) cubic-bezier(.2, .8, .2, 1) calc(.8s * var(--t)) both; }
.card::before { position: absolute; left: 14%; right: 14%; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, #fff, transparent); content: ""; }
.card::after { position: absolute; right: -46px; top: -46px; width: 170px; height: 170px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--skin-light) 70%, #fff) 0%, color-mix(in srgb, var(--skin-light) 30%, transparent) 38%, transparent 70%); content: ""; pointer-events: none; mix-blend-mode: screen; animation: fade calc(1.6s * var(--t)) ease calc(1.6s * var(--t)) both; }
