<script type="application/larch-params">
{
  "accent": { "type": "color", "label": "餘燼重點色", "labelEn": "Ember accent", "default": "#e8743b" },
  "light": { "type": "color", "label": "落日光顏色", "labelEn": "Sunset light", "default": "#ffb066" },
  "eyebrow": { "type": "text", "label": "標題上方小字", "labelEn": "Eyebrow", "default": "EMBERS AT DUSK", "maxLength": 40 },
  "howto": { "type": "text", "label": "選單下方的說明（空白＝不顯示）", "labelEn": "How to play", "default": "按下「開始遊戲」後全程自動播放。戴上耳機，不用點滑鼠。", "maxLength": 60 },
  "place": { "type": "select", "label": "信紙位置", "labelEn": "Card position", "options": [{ "value": "center", "label": "置中", "labelEn": "Center" }, { "value": "left", "label": "靠左", "labelEn": "Left" }], "default": "center" },
  "veil": { "type": "range", "label": "暮色濃度", "labelEn": "Dusk veil", "min": 0, "max": 70, "step": 5, "unit": "%", "default": 35 },
  "rays": { "type": "toggle", "label": "落日光暈", "labelEn": "Sunset glow", "default": true },
  "motes": { "type": "toggle", "label": "飄升的火星", "labelEn": "Rising sparks", "default": true },
  "intro": { "type": "select", "label": "入場動畫", "labelEn": "Entrance", "options": [{ "value": "full", "label": "完整", "labelEn": "Full" }, { "value": "quick", "label": "快速", "labelEn": "Quick" }, { "value": "off", "label": "關閉", "labelEn": "Off" }], "default": "full" },
  "bgm": { "type": "audio", "kind": "music", "label": "標題音樂（空白＝沿用專案的標題 BGM）", "labelEn": "Title music", "default": "" },
  "hover": { "type": "audio", "kind": "sfx", "label": "按鈕滑過音效", "labelEn": "Button hover sound", "default": "@SFX:hover@" },
  "press": { "type": "audio", "kind": "sfx", "label": "按下按鈕音效（鉛筆點紙）", "labelEn": "Button press sound", "default": "@SFX:press@" }
}
</script>
<style>
:root { /*TOKENS*/ }
:root { --skin-accent: #e8743b; --skin-light: #ffb066; --skin-veil: 35%; --t: 1; }
html[data-skin-intro="quick"] { --t: .45; }
html[data-skin-intro="off"] { --t: 0; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: radial-gradient(ellipse at 70% 10%, #5a2a14, #2a140c 55%, #120a07); }
body { color: var(--ink); font-family: var(--serif); }
.screen { position: fixed; inset: 0; overflow: hidden; isolation: isolate; }
/* 1. 封面從暗處慢慢亮起來，之後極慢地呼吸（只有縮放，沒有移動的特效）。 */
.cover { position: absolute; inset: -2%; width: 104%; height: 104%; object-fit: cover; animation: clear calc(2.4s * var(--t)) cubic-bezier(.2, .7, .2, 1) both, drift 60s ease-in-out calc(2.4s * var(--t)) infinite alternate; }
.cover:not([src]) { display: none; }
@keyframes clear { from { transform: scale(1.05); filter: brightness(.35) saturate(.7); } to { transform: scale(1); filter: none; } }
@keyframes drift { from { transform: scale(1); } to { transform: scale(1.035); } }
.wash { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 64% at 50% 54%, rgba(18, 8, 4, .5), transparent 78%), linear-gradient(180deg, color-mix(in srgb, #1a0c06 var(--skin-veil), transparent), color-mix(in srgb, #120804 calc(var(--skin-veil) + 25%), transparent)); }
html[data-skin-place="left"] .wash { background: radial-gradient(ellipse 50% 70% at 26% 52%, rgba(18, 8, 4, .55), transparent 76%), linear-gradient(90deg, color-mix(in srgb, #120804 calc(var(--skin-veil) + 25%), transparent), color-mix(in srgb, #1a0c06 var(--skin-veil), transparent) 65%); }
.lift { position: absolute; inset: 0; z-index: 6; background: #120a07; pointer-events: none; animation: lift calc(2s * var(--t)) cubic-bezier(.4, 0, .2, 1) both; }
@keyframes lift { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
/* 2. 落日從右上角透進來：一團暖光慢慢明暗。 */
.rays { position: absolute; right: -6%; top: -18%; z-index: 1; width: 60vmax; height: 60vmax; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, color-mix(in srgb, var(--skin-light) 55%, transparent), color-mix(in srgb, var(--skin-light) 18%, transparent) 40%, transparent 70%); mix-blend-mode: screen; animation: fade calc(2.2s * var(--t)) ease calc(.6s * var(--t)) both, breathe 11s ease-in-out infinite alternate; }
html[data-skin-rays="off"] .rays { display: none; }
@keyframes breathe { from { opacity: .85; } to { opacity: .4; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
/* 3. 火星：只有九顆，小、慢、很淡。 */
.motes { position: absolute; inset: 0; z-index: 2; pointer-events: none; animation: fade calc(2s * var(--t)) ease calc(1.4s * var(--t)) both; }
html[data-skin-motes="off"] .motes { display: none; }
.motes i { position: absolute; bottom: -4%; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%; background: radial-gradient(circle, #ffd9a0 0 30%, rgba(232, 116, 59, .5) 55%, transparent 72%); opacity: 0; animation: rise var(--d) linear var(--w) infinite; }
.motes i:nth-child(1) { --x: 8%; --s: 5px; --d: 26s; --w: -4s; --dx: 40px; }
.motes i:nth-child(2) { --x: 19%; --s: 4px; --d: 31s; --w: -13s; --dx: -30px; }
.motes i:nth-child(3) { --x: 33%; --s: 6px; --d: 28s; --w: -9s; --dx: 50px; }
.motes i:nth-child(4) { --x: 47%; --s: 4px; --d: 34s; --w: -22s; --dx: -36px; }
.motes i:nth-child(5) { --x: 58%; --s: 5px; --d: 27s; --w: -2s; --dx: 30px; }
.motes i:nth-child(6) { --x: 69%; --s: 6px; --d: 36s; --w: -17s; --dx: -48px; }
.motes i:nth-child(7) { --x: 78%; --s: 4px; --d: 29s; --w: -11s; --dx: 36px; }
.motes i:nth-child(8) { --x: 88%; --s: 5px; --d: 33s; --w: -25s; --dx: -28px; }
.motes i:nth-child(9) { --x: 95%; --s: 4px; --d: 30s; --w: -7s; --dx: 24px; }
@keyframes rise { 0% { transform: translate3d(0, 0, 0); opacity: 0; } 12% { opacity: .8; } 80% { opacity: .35; } 100% { transform: translate3d(var(--dx), -105vh, 0); opacity: 0; } }
/* 4. 中間一張信紙。 */
.stage { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; padding: 28px; }
html[data-skin-place="left"] .stage { justify-items: start; padding-left: max(28px, 7vw); }
.card { position: relative; width: min(620px, 100%); max-height: 100%; padding: clamp(32px, 4.4vw, 50px) clamp(26px, 4.6vw, 58px) clamp(28px, 3.6vw, 40px); border-radius: 6px; color: var(--ink); text-align: center;
  background: radial-gradient(120% 140% at 50% 0%, color-mix(in srgb, var(--paper) 94%, transparent), color-mix(in srgb, var(--paper-2) 92%, transparent) 78%, color-mix(in srgb, var(--paper-edge) 94%, transparent));
  box-shadow: 0 0 0 1px var(--paper-line), 0 0 34px 4px var(--glow), 0 44px 90px -26px rgba(0, 0, 0, .75); animation: card-in calc(1.4s * var(--t)) cubic-bezier(.2, .8, .2, 1) calc(.8s * var(--t)) both; }
.card::before { position: absolute; inset: 0; border-radius: inherit; content: ""; pointer-events: none; background: repeating-linear-gradient(180deg, transparent 0 33px, var(--rule) 33px 34px), radial-gradient(60% 40% at 0% 100%, rgba(168, 54, 31, .24), transparent 70%), radial-gradient(50% 35% at 100% 0%, rgba(232, 116, 59, .22), transparent 70%); }
.card::after { position: absolute; inset: 0; border-radius: inherit; content: ""; pointer-events: none; box-shadow: inset 0 0 38px 6px rgba(110, 40, 15, .4), inset 0 -2px 0 rgba(232, 116, 59, .55); }
@keyframes card-in { from { opacity: 0; translate: 0 22px; } to { opacity: 1; translate: 0 0; } }
.card > * { position: relative; z-index: 1; }
.eyebrow { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 0; color: var(--ink-soft); font: 600 11px/1.4 var(--sans); letter-spacing: .44em; text-indent: .44em; text-transform: uppercase; animation: track calc(1.3s * var(--t)) cubic-bezier(.2, .7, .2, 1) calc(1.3s * var(--t)) both; }
.eyebrow i { width: 26px; height: 1px; flex: none; background: currentColor; opacity: .55; }
.eyebrow span[data-empty] { display: none; }
@keyframes track { from { opacity: 0; letter-spacing: .9em; } to { opacity: 1; letter-spacing: .44em; } }
h1 { margin: 16px 0 0; color: var(--ink); font: 600 clamp(32px, 4.6vw, 56px)/1.26 var(--serif); letter-spacing: .14em; text-indent: .14em; text-wrap: balance; overflow-wrap: anywhere; text-shadow: 0 1px 0 rgba(255, 244, 222, .5); animation: title-in calc(1.7s * var(--t)) cubic-bezier(.2, .7, .2, 1) calc(1.4s * var(--t)) both; }
@keyframes title-in { from { opacity: 0; filter: blur(10px); letter-spacing: .4em; } to { opacity: 1; filter: blur(0); letter-spacing: .14em; } }
.rule { position: relative; width: 180px; height: 1px; margin: 22px auto 18px; background: linear-gradient(90deg, transparent, rgba(43, 29, 20, .5), transparent); animation: grow calc(1.1s * var(--t)) cubic-bezier(.2, .7, .2, 1) calc(2.1s * var(--t)) both; }
.rule i { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; border-radius: 50%; background: var(--skin-accent); box-shadow: 0 0 10px 3px color-mix(in srgb, var(--skin-accent) 70%, transparent); translate: -50% -50%; animation: pop calc(.8s * var(--t)) cubic-bezier(.3, 1.6, .5, 1) calc(2.6s * var(--t)) both; }
@keyframes grow { from { opacity: 0; scale: 0 1; } to { opacity: 1; scale: 1 1; } }
@keyframes pop { from { opacity: 0; scale: 0; } to { opacity: 1; scale: 1; } }
.subtitle { max-width: 30em; margin: 0 auto; color: var(--ink-soft); font-size: clamp(14px, 1.15vw, 16px); line-height: 1.9; letter-spacing: .08em; text-wrap: pretty; animation: rise-in calc(1.1s * var(--t)) ease-out calc(2.3s * var(--t)) both; }
.subtitle[data-empty] { display: none; }
.howto { max-width: 30em; margin: 18px auto 0; color: color-mix(in srgb, var(--skin-accent) 70%, #2a1208); font-weight: 600; font-size: clamp(14px, 1.1vw, 16px); line-height: 1.8; letter-spacing: .08em; animation: rise-in calc(1.1s * var(--t)) ease-out calc(2.8s * var(--t)) both; }
.howto:empty { display: none; }
@keyframes rise-in { from { opacity: 0; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }
/* 5. 按鈕：細線的紙條，幾顆都排成置中的一列、等寬；手機直排。選中用 inset 框，不位移。 */
.menu { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 168px); justify-content: center; gap: 12px; margin-top: 30px; }
.menu button { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; min-height: 46px; padding: 0 14px; border: 1px solid var(--pencil); border-radius: 3px; background: rgba(255, 244, 222, .35); color: var(--ink); font: 600 15px/1.2 var(--serif); letter-spacing: .16em; cursor: pointer; transition: background .2s, border-color .2s, color .2s, box-shadow .2s; animation: rise-in calc(.8s * var(--t)) cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc((2.6s + var(--i, 0) * .12s) * var(--t)); }
.menu button[hidden] { display: none; }
.menu button:nth-of-type(2) { --i: 1; }
.menu button:nth-of-type(3) { --i: 2; }
.menu button:nth-of-type(4) { --i: 3; }
.menu button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu button.primary { border-color: var(--ink); border-left: 3px solid var(--rose); background: rgba(255, 244, 222, .62); }
.menu button.primary::before { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--skin-accent); box-shadow: 0 0 0 1px var(--ember-deep), 0 0 8px var(--skin-accent); content: ""; }
.menu button:hover:not(:disabled), .menu button:focus-visible { border-color: var(--ember-deep); background: #f6e6c6; color: var(--ember-deep); outline: none; box-shadow: inset 0 0 0 1px var(--ember), 0 0 16px -2px rgba(232, 116, 59, .6); }
.menu button:focus-visible { box-shadow: inset 0 0 0 2px var(--ember-deep), 0 0 0 2px rgba(246, 230, 198, .9), 0 0 16px 0 rgba(232, 116, 59, .6); }
.menu button:active:not(:disabled) { background: #e8c690; }
.menu button:disabled { border-style: dashed; border-color: var(--pencil); background: rgba(190, 170, 140, .3); color: var(--pencil); cursor: not-allowed; }
.menu button.primary:disabled::before { display: none; }
@media (max-width: 760px), (max-aspect-ratio: 4/5) {
  .stage, html[data-skin-place="left"] .stage { justify-items: center; align-items: end; padding: 18px 18px max(7vh, 28px); }
  .card { padding: 28px 22px 24px; }
  .eyebrow { gap: 10px; font-size: 10.5px; letter-spacing: .3em; text-indent: .3em; }
  .eyebrow i { width: 16px; }
  h1 { margin-top: 12px; font-size: clamp(26px, 8vw, 38px); letter-spacing: .1em; text-indent: .1em; }
  .rule { width: 130px; margin: 16px auto 14px; }
  .subtitle { font-size: 14px; line-height: 1.8; }
  .menu { grid-auto-flow: row; grid-template-columns: minmax(0, 1fr); grid-auto-columns: auto; gap: 10px; margin-top: 22px; }
  .menu button { min-height: 48px; }
  .rays { right: -30%; }
}
@media (max-height: 520px) and (min-width: 761px) {
  .card { padding: 22px 40px 22px; }
  h1 { margin-top: 8px; font-size: 34px; }
  .rule { margin: 12px auto 10px; }
  .subtitle { line-height: 1.6; }
  .menu { margin-top: 16px; }
  .menu button { min-height: 40px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition: none !important; }
  .motes { display: none; }
}
</style>
<main class="screen">
  <img class="cover" data-larch-slot="cover" alt="">
  <div class="wash" aria-hidden="true"></div>
  <div class="rays" aria-hidden="true"></div>
  <div class="motes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="stage">
    <section class="card">
      <p class="eyebrow"><i></i><span data-larch-param="eyebrow"></span><i></i></p>
      <h1 data-larch-slot="title"></h1>
      <div class="rule" aria-hidden="true"><i></i></div>
      <p class="subtitle" data-larch-slot="description"></p>
      <nav class="menu" aria-label="主選單">
        <button class="primary" data-larch-action="start"><span data-larch-label="start">開始遊戲</span></button>
        <button data-larch-action="continue"><span data-larch-label="continue">繼續遊戲</span></button>
        <button data-larch-action="chapters"><span data-larch-label="chapters">選擇章節</span></button>
        <button data-larch-action="gallery"><span data-larch-label="gallery">CG 收藏</span></button>
      </nav>
      <p class="howto" data-larch-param="howto"></p>
    </section>
  </div>
  <div class="lift" aria-hidden="true"></div>
</main>
