# 後台二樓（m-backstage-2f）：2026-10-21 作者拍板，後台拆成兩張各自平的地圖。
#   化妝間的門過來落在這裡；鋼琴與周老師；東邊一段階梯往北走進拱門＝下樓，傳到一樓（objects_backstage.yaml）的階梯南端。
#   兩層的階梯位置相同（x15–16、第 3–7 列）。
map: {id: m-backstage-2f, w: 18, h: 12}

ground:
