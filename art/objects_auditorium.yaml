# 觀眾席（m-auditorium）：跟 CG（s_soundcheck_1、s_concert_1）是同一座戲院：大舞台、紅絨座位分三區、兩條走道、後方音控台。
# 規模：一千個座位畫不完，地圖畫前段 3 排、三區（6／8／6），後面暗下去。三排十四號＝第三排、從左數第十四個位子（左區 6＋中區第 8 個）。
# 2026-10-20 照《十一分鐘》標準重做：座位一排一個物件（同一張圖重複），整齊成列；排與排之間是可走的走道列。
# 2026-10-20 門的規則（作者：門製作得非常奇怪）：相機從南邊看，只看得到朝南的牆面，所以門一律做在朝南的面上。
#   舞台前緣的木裙只有三格高（含一格腳燈），放不下約 3 格高的門；通後台的門改做在舞台後牆（朝南的牆面）、紅絨幕旁，正面朝南，門前一格（舞台地板）是觸發點。
