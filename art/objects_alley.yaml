# 後門巷子（m-alley）：傍晚，巷子盡頭是黃昏市場的燈，地上一層沖地流過來的水。
# 2026-10-20 照《十一分鐘》標準重做：北牆（戲院後牆）整排畫成牆，後門與市場店面是牆的一段；機車、菜籃貼牆整齊停放。
map: {id: m-alley, w: 18, h: 12}

