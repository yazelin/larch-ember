# 後台一樓（m-backstage）：2026-10-21 作者拍板，後台拆成兩張各自平的地圖（不再有 U 型樓梯＋遮擋牆）。
#   一樓：側台門（通觀眾席）、後門（通巷子）、道具與長椅；東邊一段看得見的階梯往北走進拱門＝上樓，傳到二樓（objects_backstage2f.yaml）的對應樓梯口。
#   兩層的階梯在同一個位置（x15–16、第 3–7 列）：從南邊（第 8 列）走上階梯、走到最北一格（第 3 列，樓梯口）就淡出，換到另一層的階梯南端。
# 人高約 3.4 格。物件 up ≤ 1（牆面除外），中間空地至少 5 排可走。
map: {id: m-backstage, w: 18, h: 12}

ground:
  - {name: 外牆, kind: border, rects: [[0, 0, 18, 3], [0, 0, 1, 12], [17, 0, 1, 12], [0, 11, 18, 1]]}
  - {name: 一樓後台, kind: concrete, rects: [[1, 3, 16, 8]], desc: 灰色水泥地，幾條褪色的舞台膠帶記號與一條整齊的黑色電線，地面乾淨平整，沒有雜物}
  - {name: 樓梯, kind: stairs, rects: [[15, 3, 2, 5]], desc: 靠東牆的一段木頭階梯往北上去：每一階是一塊獨立的木板，階與階之間有一條深色的踢腳陰影線，一階一階清楚地分開，橫向整齊排列，全程同樣的階高}

objects:
  # ── 北牆（第 0–2 列是牆面，物件佔地在第 2 列）──
  - {name: 北牆左, type: b_brick, kind: 隔間牆, foot: [1, 2, 2, 1], up: 2, desc: 老紅磚牆面，水泥勾縫}
  - {name: 側台門, type: door_stage, kind: 門, foot: [3, 2, 2, 1], up: 2, desc: 磚牆裡的側台門，通觀眾席：石框、深色木門板、門前石階；門前 (3,3)(4,3) 是觸發點}
  - {name: 北牆中, type: b_brick, kind: 隔間牆, foot: [5, 2, 5, 1], up: 2, desc: 同左}
  - {name: 後門, type: door_steel, kind: 門, foot: [10, 2, 2, 1], up: 2, desc: 磚牆裡的後門，通巷子：石框、灰色鋼門板、門前腳墊；門前 (10,3)(11,3) 是觸發點}
  - {name: 北牆右, type: b_brick, kind: 隔間牆, foot: [12, 2, 3, 1], up: 2, desc: 同左}
  - {name: 樓梯拱門, type: b_arch, kind: 隔間牆, foot: [15, 2, 2, 1], up: 2, desc: 磚牆裡一個深色拱門，階梯往上通進去，上樓；階梯最北一格 (15,3)(16,3) 是樓梯口}
  # ── 貼北牆 ──
  - {name: 工作桌, type: b_table, kind: 桌, foot: [6, 3, 3, 1], up: 1, desc: 兩扇門之間貼牆的木工作桌，一盞檯燈、幾個沙袋、一捲膠帶}
  - {name: 器材箱, type: b_cases, kind: 雜物, foot: [1, 3, 2, 1], up: 1, desc: 側台門左邊貼牆疊起來的兩個黑色器材箱}
  - {name: 舊木箱, type: b_trunk, kind: 雜物, foot: [12, 3, 2, 1], up: 1, desc: 後門右邊貼牆的一只大舊木箱，銅包角}
  # ── 空地上 ──
  - {name: 長椅, type: b_bench, kind: 椅, foot: [6, 7, 4, 1], up: 1, desc: 後台中間一張長木凳，等上場的人坐}
  - {name: 服裝架, type: b_rack, kind: 櫃, foot: [12, 6, 2, 1], up: 1, desc: 帶輪子的服裝架，掛幾件舞台服}
  - {name: 器材箱二, type: b_cases, kind: 雜物, foot: [2, 8, 2, 1], up: 1, desc: 左下角兩個疊起來的黑色器材箱}
  - {name: 舊木箱二, type: b_trunk, kind: 雜物, foot: [10, 9, 2, 1], up: 1, desc: 靠下方的一只舊木箱}

