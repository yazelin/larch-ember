# 後台（m-backstage）：一張圖同時看得到二樓與一樓。二樓是架在一樓上方的陽台走廊，前緣是欄杆＋一樓高的牆面；
# 右側樓梯從陽台往下到一樓。疊層：陽台前緣物件的占地是牆面那一列，人在陽台上（北邊）被欄杆擋在後面、人在一樓（南邊）畫在前面。
