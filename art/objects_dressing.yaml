  - {name: 收音機桌, type: d_radio, kind: 桌, foot: [12, 3, 2, 1], up: 1, desc: 小木桌上一台舊的奶白塑膠殼手提收音機，邊角被魚水泡得發白}
  # ── 房間裡 ──
  - {name: 椅子, type: d_chair, kind: 椅, foot: [3, 4, 1, 1], up: 1, desc: 化妝台前的木椅，背朝鏡頭}
