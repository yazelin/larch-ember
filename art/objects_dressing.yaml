# 永明戲院二樓化妝間（m-dressing）：17:00–18:00 探索主地圖。單位：格（人高約 3.4 格）。
# 2026-10-20 照《十一分鐘》標準重做（作者：東西要仔細布局、整齊在格內、每個物件大小要有設計）：
#   家具貼牆成排、對齊格線、左右對稱；北牆面（第 0–2 列）整排畫成牆，窗與門是牆的一段；東西側牆只是地面的深色外框。
#   type：同一種圖共用（見 art/mapgen.py TYPES 的尺寸與提示詞）；frame ＝ [x, y-up, w, h+up]。
map: {id: m-dressing, w: 18, h: 12}

ground:
  - {name: 外牆, kind: border, rects: [[0, 0, 18, 3], [0, 0, 1, 12], [17, 0, 1, 12], [0, 11, 18, 1]]}
  - {name: 木地板, kind: wood, rects: [[1, 3, 16, 8]], desc: 暖棕色的老木地板，長條板縫整齊平行，窗口透進來的橘色夕陽在地板上留幾塊柔和的光斑}
  - {name: 地毯, kind: rug, rects: [[5, 5, 8, 4]], desc: 一塊褪色的酒紅色花紋長方地毯，邊緣整齊，居中}

objects:
  # ── 北牆（第 0–2 列是牆面，物件佔地在第 2 列）──
  - {name: 北牆左, type: d_wall, kind: 隔間牆, foot: [1, 2, 6, 1], up: 2, desc: 奶油色老灰泥牆，下三分之一是深色木護壁}
  - {name: 窗, type: d_window, kind: 隔間牆, foot: [7, 2, 4, 1], up: 2, desc: 牆面正中一扇朝西的大木框窗，外面是橘色夕陽與台南老街屋頂，兩側紅絨窗簾束起}
  - {name: 北牆右, type: d_wall, kind: 隔間牆, foot: [11, 2, 4, 1], up: 2, desc: 同左}
  - {name: 化妝間門, type: door_wood, kind: 門, foot: [15, 2, 2, 1], up: 2, desc: 深色木門，黃銅把手，門牌（不放字）；門前（15,3）是觸發點}
  # ── 北牆前的家具（佔地在第 3 列）──
