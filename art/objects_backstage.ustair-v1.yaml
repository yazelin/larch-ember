# 後台（m-backstage）新版：二樓在地圖中段，樓梯做成 U 型。路線（作者 2026-10-19 畫的）：
#   二樓平台 → 東走進 A 段（看得見）→ 往北 → 北端向右轉（轉折，整個人被牆擋住）→ B 段往南（北半仍被擋）→ 走到足夠南才現身 → 一樓
#   不論開始下樓還是最後走出來，沒被擋住的格子都要是樓梯。
# 人高約 3.4 格：站在 (x,y) 的人，畫面佔 x..x+1、y-2.4..y+1。遮擋物排序比人的列大才會蓋住人，等於的話人在上面。
#   轉折牆 sort 3：蓋住第 2 列以北（轉折＋A 段最上一格＋B 段第 2 列）。
#   B 上段牆 sort 5：蓋住 B 段第 3–4 列；第 5 列起人在牆前面，現身。
map: {id: m-backstage, w: 18, h: 16}

ground:
  - {name: 外牆, kind: border, rects: [[0, 0, 12, 2], [12, 0, 5, 1], [0, 0, 1, 11], [0, 13, 1, 3], [17, 0, 1, 12], [17, 14, 1, 2], [0, 15, 18, 1]]}
  - {name: 二樓平台, kind: wood, rects: [[1, 3, 11, 5]]}
  - {name: 轉折平台, kind: wood, rects: [[12, 1, 5, 1]]}
  - {name: A 段樓梯, kind: stairs, rects: [[12, 2, 2, 5]]}
  - {name: B 段樓梯, kind: stairs, rects: [[15, 2, 2, 10]]}
  - {name: 一樓後台, kind: concrete, rects: [[1, 10, 16, 5]]}

objects:
  # ── 二樓：北牆（左段、化妝間門、右段）、鋼琴、東欄杆 ──
  - {name: 北牆左, kind: 隔間牆, foot: [1, 2, 2, 1], up: 2, desc: 二樓走廊北牆（左段）}
  - {name: 化妝間門, kind: 門, foot: [3, 2, 2, 1], up: 2, desc: 二樓化妝間的門，門前（4,3）是觸發點}
  - {name: 北牆右, kind: 隔間牆, foot: [5, 2, 7, 1], up: 2, desc: 二樓走廊北牆（右段）}
  - {name: 直立鋼琴, kind: 櫃, foot: [7, 3, 3, 1], up: 1, desc: 靠北牆的舊直立鋼琴，周老師站在它南邊（8,4）}
  - {name: 東欄杆, kind: 雜物, foot: [11, 3, 1, 3], up: 1, desc: 二樓東緣欄杆，只留 (11,6) 一格通往樓梯 A 段}
  - {name: 陽台前緣, kind: 雜物, foot: [1, 8, 11, 2], up: 1, desc: 二樓前緣的欄杆與一整層樓高的磚牆；人在二樓被它擋住腳，在一樓畫在前面}
  # ── 樓梯井 ──
  - {name: A 段底牆, kind: 隔間牆, foot: [12, 7, 2, 1], up: 0, desc: A 段南端封住，只能從二樓 (11,6) 進}
  - {name: 樓梯中隔牆, kind: 隔間牆, foot: [14, 2, 1, 8], up: 2, desc: A、B 兩段中間的隔牆，不給人從 A 直接跨到 B}
  - {name: 轉折牆, kind: 雜物, foot: [12, 1, 4, 2], frame: [11, 0, 6, 3], gap: [[12,1],[13,1],[14,1],[15,1],[12,2],[13,2],[14,2],[15,2]], sort: 3, desc: 蓋住轉折（只擋視覺、占地全可走）。圖框 x11–16、列 0–2（左右各多 1 格，不留人物邊緣的縫）}
  - {name: B 上段牆, kind: 雜物, foot: [15, 3, 2, 2], frame: [14, 0, 3, 5], gap: [[15,3],[16,3],[15,4],[16,4]], sort: 5, desc: 蓋住 B 段第 3–4 列（只擋視覺）。圖框 x14–16、列 0–4；走到第 5 列才現身}
  # ── 一樓 ──
  - {name: 器材箱, kind: 雜物, foot: [5, 12, 2, 1], up: 1, desc: 兩個疊起來的黑色器材箱}
  - {name: 側台門, kind: 門, foot: [0, 11, 1, 2], up: 1, desc: 西牆的側台門，通觀眾席；門前 (1,12) 是觸發點}
  - {name: 後門, kind: 門, foot: [17, 12, 1, 2], up: 1, desc: 東牆的後門，通巷子；門前 (16,12) 是觸發點}

